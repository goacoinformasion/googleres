<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <style>
        img {
            height: 50px;
        }

        #studentResult {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .result-title {
            text-align: center;
            background: #1e3a8a;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result-section,
        .semester-container,
        .final-result {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-title,
        .semester-title {
            margin-top: 0;
            margin-bottom: 15px;
            color: #1e3a8a;
            border-bottom: 2px solid #1e3a8a;
            padding-bottom: 8px;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table th,
        .result-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .result-table th {
            background: #f1f5f9;
            font-weight: 600;
        }

        .result-table tbody tr:hover {
            background: #f8fafc;
        }

        .paper-table {
            margin-top: 15px;
        }

        .paper-table th {
            background: #1e3a8a;
            color: white;
            text-align: center;
        }

        .paper-table td {
            text-align: center;
        }

        .semester-summary {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .summary-box {
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .summary-label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .summary-value {
            font-size: 18px;
            color: #1e3a8a;
        }

        .final-result {
            border: 2px solid #1e3a8a;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .button-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            background: #01609f;
            color: white;
        }

        @media (max-width: 768px) {
            .semester-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }

        .second-class {
            color: #5e3100;
            background: #ffffff !important;
        }

        .fail {
            color: #ff0000;
            background: #ffecec !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: left;
        }

        table {
            border: none;
            border-spacing: 0;
            min-width: 680px;
            border-radius: 6px;
            overflow: hidden;
        }

        table thead {
            background-color: #01609f;
            color: #ffffff;
        }

        tr {
            padding: 10px;
        }

        th {
            padding: 10px;
            text-transform: capitalize;
        }

        tr:nth-child(even) {
            background-color: #f8f6ff;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            padding: 10px;
            margin-top: 24px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        #root {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .main-title {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }

        section.topper-section {
            margin-top: 20px;
        }

        .section-title {
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            color: #2980b9;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .lists-container {
            display: grid;
            gap: 15px;
        }

        .list-item {
            display: flex;
            flex-direction: column;
            background: #fafafa;
            border: 1px solid #e1e8ed;
            padding: 18px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .list-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.05);
            background: #fff;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .content-area {
            flex-grow: 1;
        }

        /* Name aur Roll Number styling */
        .name {
            font-weight: 600;
            font-size: 16px;
            color: #2c3e50;
        }

        .roll-no {
            font-weight: normal;
            color: #7f8c8d;
            font-size: 14px;
            margin-left: 6px;
        }

        .collage {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        /* Rank aur Subject-tag ko paas rakhne ke liye container */
        .right-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank {
            background: #e74c3c;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .sub-tag {
            font-size: 12px;
            font-weight: bold;
            color: #3498db;
            background: #eaf2f8;
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* Footer action button */
        .item-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed #e1e8ed;
        }

        .view-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .view-btn:hover {
            background: #219653;
        }
    </style>
</head>

<body>

    <script src="/js/index.js"></script>
    <script src="/js/XtrmptY.js"></script>



</body>

</html>
